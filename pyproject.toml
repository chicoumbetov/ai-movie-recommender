[project]
name = "ai-movie-recommender"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "openai==3.41.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["drafts", "examples", "checks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
